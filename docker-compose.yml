services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-glow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-glow_cosmetics}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-glow} -d ${POSTGRES_DB:-glow_cosmetics}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-glow}:${POSTGRES_PASSWORD:-glow_dev_password}@db:5432/${POSTGRES_DB:-glow_cosmetics}?schema=public
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - '${API_PORT:-4000}:4000'
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_BASE_URL: '${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-4000}/api}'
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:4000/api
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-3000}:3000'
volumes:
  postgres_data:
